version: 2

models:
  - name: agg_weekly_sales
    description: >
      Weekly sales aggregation at product/store grain. Built from
      stg_demand_forecasting. sales_week uses SQLite's strftime('%Y-%W', ...),
      an approximate (non-strict-ISO) week-of-year.
    columns:
      - name: product_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_units
        tests:
          - not_null

  - name: agg_monthly_sales
    description: >
      Monthly sales aggregation at product/store grain, plus the dominant
      demand_trend label observed that month for each product/store.
    columns:
      - name: product_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_units
        tests:
          - not_null

  - name: mart_product_store_overview
    description: >
      Analysis-ready mart, one row per product_id x store_id, joining
      demand history (units, revenue, elasticity, promo days), inventory
      status, and pricing. has_inventory_data / has_pricing_summary_data
      flag rows where the corresponding LEFT JOIN found no match.
    columns:
      - name: product_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_units_sold
        tests:
          - not_null

  - name: fct_demand_features
    description: >
      Feature table for demand prediction (LightGBM). Cross-sectional
      features only (price_vs_competitor_pct, discount_pct, promo_flag,
      revenue, promo_x_elasticity) -- lag/rolling-average features were
      dropped because 9,882 of 9,941 product/store combinations have only
      one row each, so there is no time history to compute them from.
      price_vs_competitor_pct and discount_pct are null for the ~9,877
      rows with no matching pricing_optimization row (see has_pricing_data
      upstream).
    columns:
      - name: product_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: sales_quantity
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null
      - name: promo_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false